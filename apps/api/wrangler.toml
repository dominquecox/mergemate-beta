# Non-secret config only. Secrets: see DEPLOY.md (`wrangler secret put`); locally, .dev.vars (git-ignored).
# Top level = local `wrangler dev` against the Dev GitHub App.
name = "mergemate-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
APP_ENV = "development"
STRIPE_MODE = "test"
WEB_ORIGIN = "http://localhost:8081"
SITE_ORIGIN = "https://dev.mergemate.dev"
GITHUB_APP_CLIENT_ID = "Iv1.submission-dev-example"
GITHUB_APP_SLUG = "submission-dev-example"
MODEL_ROUTE_SUMMARY = "meta:muse-spark-1.2"
# Event profile: every route on Meta's Muse models. Cost profile (after judging): risk and triage on
# workers-ai:@cf/meta/llama-3.3-70b-instruct-fp8-fast, highlight on workers-ai:@cf/meta/llama-4-scout-17b-16e-instruct.
MODEL_ROUTE_RISK = "meta:muse-spark-1.2"
MODEL_ROUTE_TRIAGE = "meta:muse-spark-1.2"
MODEL_ROUTE_HIGHLIGHT = "meta:muse-spark-1.2"
MODEL_BASE_URL = "https://api.meta.ai/v1"
# Initial value; confirm before launch.
AI_GLOBAL_DAILY_ACTIONS = "300"
# Non-secret per-env salt for hashing telemetry user indexes. Distinct per environment
# so indexes cannot be joined across datasets.
TELEMETRY_SALT = "submission-local-example-salt-configure-your-own"

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "SUPPORT_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[kv_namespaces]]
binding = "POSTS"
id = "local-posts"

[[queues.producers]]
binding = "GITHUB_EVENTS"
queue = "mergemate-github-events-local"

[[queues.consumers]]
queue = "mergemate-github-events-local"
max_batch_size = 25
max_retries = 5
dead_letter_queue = "mergemate-github-events-local-dlq"

[[queues.consumers]]
queue = "mergemate-github-events-local-dlq"

[[d1_databases]]
binding = "DB"
database_name = "mergemate-db"
database_id = "local-only"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "TOKEN_REFRESHER"
class_name = "TokenRefresher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenRefresher"]

[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "mergemate_events"

[[analytics_engine_datasets]]
binding = "AI_METRICS"
dataset = "mergemate_ai_metrics_dev"

# Workers AI. No secret is needed. AI_GATEWAY_ID (a non-secret var) is set by the owner; see DEPLOY.md.
[ai]
binding = "AI"

# Highlight uploads. The bucket is private (no public access); see DEPLOY.md for
# creation and the 1-day expiry backstop. Top level serves local `wrangler dev`.
[[r2_buckets]]
binding = "HIGHLIGHT_UPLOADS"
bucket_name = "mergemate-highlight-uploads-local"

# Image Transformations for resizing uploads and stripping their metadata. Like [ai],
# this binding must be repeated in every named environment.
[images]
binding = "IMAGES"

# Deployed environments. The D1 and KV ids below are placeholders: the owner replaces them with the
# real ids before the first deploy (DEPLOY.md). Each environment serves only from its custom domain.
[env.dev]
name = "mergemate-api-dev"
routes = [{ pattern = "api-dev.mergemate.dev", custom_domain = true }]
workers_dev = false

[env.dev.vars]
APP_ENV = "development"
STRIPE_MODE = "test"
WEB_ORIGIN = "https://dev.mergemate.dev"
SITE_ORIGIN = "https://dev.mergemate.dev"
GITHUB_APP_CLIENT_ID = "Iv1.submission-dev-example"
GITHUB_APP_SLUG = "submission-dev-example"
MODEL_ROUTE_SUMMARY = "meta:muse-spark-1.2"
# Event profile: every route on Meta's Muse models. Cost profile (after judging): risk and triage on
# workers-ai:@cf/meta/llama-3.3-70b-instruct-fp8-fast, highlight on workers-ai:@cf/meta/llama-4-scout-17b-16e-instruct.
MODEL_ROUTE_RISK = "meta:muse-spark-1.2"
MODEL_ROUTE_TRIAGE = "meta:muse-spark-1.2"
MODEL_ROUTE_HIGHLIGHT = "meta:muse-spark-1.2"
MODEL_BASE_URL = "https://api.meta.ai/v1"
# Initial value; confirm before launch.
AI_GLOBAL_DAILY_ACTIONS = "300"
# Non-secret per-env salt for hashing telemetry user indexes. Distinct per environment
# so indexes cannot be joined across datasets.
TELEMETRY_SALT = "submission-dev-example-salt-configure-your-own"

[[env.dev.ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.dev.ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[[env.dev.ratelimits]]
name = "SUPPORT_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[env.dev.queues.producers]]
binding = "GITHUB_EVENTS"
queue = "mergemate-github-events-dev"

[[env.dev.queues.consumers]]
queue = "mergemate-github-events-dev"
max_batch_size = 25
max_retries = 5
dead_letter_queue = "mergemate-github-events-dev-dlq"

[[env.dev.queues.consumers]]
queue = "mergemate-github-events-dev-dlq"

[[env.dev.durable_objects.bindings]]
name = "TOKEN_REFRESHER"
class_name = "TokenRefresher"

[[env.dev.analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "mergemate_events_dev"

[[env.dev.analytics_engine_datasets]]
binding = "AI_METRICS"
dataset = "mergemate_ai_metrics_dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mergemate-db-dev"
database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "migrations"

[[env.dev.kv_namespaces]]
binding = "POSTS"
id = "11111111111111111111111111111111"

[env.dev.ai]
binding = "AI"

[[env.dev.r2_buckets]]
binding = "HIGHLIGHT_UPLOADS"
bucket_name = "mergemate-highlight-uploads-dev"

[env.dev.images]
binding = "IMAGES"

# Production: api.mergemate.dev. Nothing in this environment points at a local or dev resource. The owner creates
# each resource once (DEPLOY.md, "Production"); the database and posts namespace were verified for MM-058:
#   D1 mergemate-db                       id verified in this production binding
#   KV namespace bound as POSTS           id verified in this production binding
#   Queues mergemate-github-events, mergemate-github-events-dlq, mergemate-stripe-events, mergemate-stripe-events-dlq
#   R2 bucket mergemate-highlight-uploads (private, 1-day expiry rule)
#   Analytics Engine datasets mergemate_events and mergemate_ai_metrics (created on first write; nothing to create)
[env.production]
name = "mergemate-api"
routes = [{ pattern = "api.mergemate.dev", custom_domain = true }]
workers_dev = false

# GITHUB_APP_CLIENT_ID and GITHUB_APP_SLUG are public values of the production GitHub App (not secrets).
# Dedicated production GitHub App identity supplied by the owner; dev uses its own App.
# WEB_ORIGIN is the web app and the only allowed browser origin; SITE_ORIGIN is the public site (post and RSS links).
# Both must match the fixed allowlists in src/config.ts, and a test pins them. STRIPE_MODE stays "disabled".
[env.production.vars]
APP_ENV = "production"
STRIPE_MODE = "disabled"
WEB_ORIGIN = "https://app.mergemate.dev"
SITE_ORIGIN = "https://mergemate.dev"
GITHUB_APP_CLIENT_ID = "Iv1.submission-production-example"
GITHUB_APP_SLUG = "submission-production-example"
MODEL_ROUTE_SUMMARY = "meta:muse-spark-1.2"
# Event profile: every route on Meta's Muse models. Cost profile (after judging): risk and triage on
# workers-ai:@cf/meta/llama-3.3-70b-instruct-fp8-fast, highlight on workers-ai:@cf/meta/llama-4-scout-17b-16e-instruct.
MODEL_ROUTE_RISK = "meta:muse-spark-1.2"
MODEL_ROUTE_TRIAGE = "meta:muse-spark-1.2"
MODEL_ROUTE_HIGHLIGHT = "meta:muse-spark-1.2"
MODEL_BASE_URL = "https://api.meta.ai/v1"
# Initial value; confirm before launch.
AI_GLOBAL_DAILY_ACTIONS = "300"
# Non-secret per-env salt for hashing telemetry user indexes. Distinct per environment
# so indexes cannot be joined across datasets.
TELEMETRY_SALT = "submission-production-example-salt-configure-your-own"

[[env.production.ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 300, period = 60 }

[[env.production.ratelimits]]
name = "SUPPORT_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

[[env.production.queues.producers]]
binding = "GITHUB_EVENTS"
queue = "mergemate-github-events"

[[env.production.queues.consumers]]
queue = "mergemate-github-events"
max_batch_size = 25
max_retries = 5
dead_letter_queue = "mergemate-github-events-dlq"

[[env.production.queues.consumers]]
queue = "mergemate-github-events-dlq"

[[env.production.durable_objects.bindings]]
name = "TOKEN_REFRESHER"
class_name = "TokenRefresher"

[[env.production.analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "mergemate_events"

[[env.production.analytics_engine_datasets]]
binding = "AI_METRICS"
dataset = "mergemate_ai_metrics"

[[env.production.d1_databases]]
binding = "DB"
database_name = "mergemate-db"
# Existing production database, verified by resource name and id (MM-058).
database_id = "22222222-2222-2222-2222-222222222222"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "POSTS"
# Existing production posts namespace, verified by id (MM-058).
id = "22222222222222222222222222222222"

[env.production.ai]
binding = "AI"

[[env.production.r2_buckets]]
binding = "HIGHLIGHT_UPLOADS"
bucket_name = "mergemate-highlight-uploads"

[env.production.images]
