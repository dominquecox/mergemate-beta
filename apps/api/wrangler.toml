# Non-secret config only. Secrets: see DEPLOY.md (`wrangler secret put`); locally, .dev.vars (git-ignored).
# Top level = local `wrangler dev` against the Dev GitHub App.
name = "mergemate-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
APP_ENV = "development"
STRIPE_MODE = "test"
WEB_ORIGIN = "http://localhost:8081"
SITE_ORIGIN = "https://dev.mergemate.dev"
GITHUB_APP_CLIENT_ID = "Iv1.submission-dev-example"
GITHUB_APP_SLUG = "submission-production-example"
MODEL_ROUTE_SUMMARY = "meta:muse-spark-1.2"
# Event profile: every route on Meta's Muse models. Cost profile (after judging): risk and triage on
# workers-ai:@cf/meta/llama-3.3-70b-instruct-fp8-fast, highlight on workers-ai:@cf/meta/llama-4-scout-17b-16e-instruct.
MODEL_ROUTE_RISK = "workers-ai:meta/muse-spark-open"
MODEL_ROUTE_TRIAGE = "workers-ai:meta/muse-spark-open"
MODEL_ROUTE_HIGHLIGHT = "workers-ai:meta/muse-spark-open"
MODEL_BASE_URL = "https://api.meta.ai/v1"
# Initial value; confirm before launch.
AI_GLOBAL_DAILY_ACTIONS = "300"

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "SUPPORT_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[kv_namespaces]]
binding = "POSTS"
id = "local-posts"

[[queues.producers]]
binding = "GITHUB_EVENTS"
queue = "mergemate-github-events-local"

[[queues.consumers]]
queue = "mergemate-github-events-local"
max_batch_size = 25
max_retries = 5
dead_letter_queue = "mergemate-github-events-local-dlq"

[[queues.consumers]]
queue = "mergemate-github-events-local-dlq"

[[d1_databases]]
binding = "DB"
database_name = "mergemate-db"
database_id = "local-only"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "TOKEN_REFRESHER"
class_name = "TokenRefresher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenRefresher"]

[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "mergemate_events"

[[analytics_engine_datasets]]
binding = "AI_METRICS"
dataset = "mergemate_ai_metrics_dev"

# Workers AI. No secret is needed. AI_GATEWAY_ID (a non-secret var) is set by the owner; see DEPLOY.md.
[ai]
binding = "AI"

# Highlight uploads. The bucket is private (no public access); see DEPLOY.md for
# creation and the 1-day expiry backstop. Top level serves local `wrangler dev`.
[[r2_buckets]]
binding = "HIGHLIGHT_UPLOADS"
bucket_name = "mergemate-highlight-uploads-local"

# Image Transformations for resizing uploads and stripping their metadata. Like [ai],
# this binding must be repeated in every named environment.
[images]
binding = "IMAGES"

# Deployed environments. The D1 and KV ids below are placeholders: the owner replaces them with the
# real ids before the first deploy (DEPLOY.md). Each environment serves only from its custom domain.
[env.dev]
name = "mergemate-api-dev"
routes = [{ pattern = "api-dev.mergemate.dev", custom_domain = true }]
workers_dev = false

[env.dev.vars]
APP_ENV = "development"
STRIPE_MODE = "test"
WEB_ORIGIN = "https://dev.mergemate.dev"
SITE_ORIGIN = "https://dev.mergemate.dev"
GITHUB_APP_CLIENT_ID = "Iv1.submission-dev-example"
GITHUB_APP_SLUG = "submission-production-example"
MODEL_ROUTE_SUMMARY = "meta:muse-spark-1.2"
# Event profile: every route on Meta's Muse models. Cost profile (after judging): risk and triage on
# workers-ai:@cf/meta/llama-3.3-70b-instruct-fp8-fast, highlight on workers-ai:@cf/meta/llama-4-scout-17b-16e-instruct.
MODEL_ROUTE_RISK = "workers-ai:meta/muse-spark-open"
MODEL_ROUTE_TRIAGE = "workers-ai:meta/muse-spark-open"
MODEL_ROUTE_HIGHLIGHT = "workers-ai:meta/muse-spark-open"
MODEL_BASE_URL = "https://api.meta.ai/v1"
# Initial value; confirm before launch.
AI_GLOBAL_DAILY_ACTIONS = "300"

[[env.dev.ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.dev.ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[[env.dev.ratelimits]]
name = "SUPPORT_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[env.dev.queues.producers]]
binding = "GITHUB_EVENTS"
queue = "mergemate-github-events-dev"

[[env.dev.queues.consumers]]
queue = "mergemate-github-events-dev"
max_batch_size = 25
max_retries = 5
dead_letter_queue = "mergemate-github-events-dev-dlq"

[[env.dev.queues.consumers]]
queue = "mergemate-github-events-dev-dlq"

[[env.dev.durable_objects.bindings]]
name = "TOKEN_REFRESHER"
class_name = "TokenRefresher"

[[env.dev.analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "mergemate_events_dev"

[[env.dev.analytics_engine_datasets]]
binding = "AI_METRICS"
dataset = "mergemate_ai_metrics_dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mergemate-db-dev"
database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "migrations"

[[env.dev.kv_namespaces]]
binding = "POSTS"
id = "11111111111111111111111111111111"

[env.dev.ai]
binding = "AI"

[[env.dev.r2_buckets]]
binding = "HIGHLIGHT_UPLOADS"
bucket_name = "mergemate-highlight-uploads-dev"

[env.dev.images]
binding = "IMAGES"

[env.production]
name = "mergemate-api"
routes = [{ pattern = "api.mergemate.dev", custom_domain = true }]
workers_dev = false

# The production GitHub App's client id and slug are added when that app exists.
[env.production.vars]
APP_ENV = "production"
STRIPE_MODE = "disabled"
WEB_ORIGIN = "https://app.mergemate.dev"
SITE_ORIGIN = "https://mergemate.dev"
