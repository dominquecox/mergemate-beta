# Non-secret config only. Secrets: see DEPLOY.md (`wrangler secret put`); locally, .dev.vars (git-ignored).
# Top level = local `wrangler dev` against the Dev GitHub App.
name = "mergemate-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
APP_ENV = "development"
STRIPE_MODE = "test"
WEB_ORIGIN = "http://localhost:8081"
GITHUB_APP_CLIENT_ID = "Iv1.submission-dev-example"
GITHUB_APP_SLUG = "submission-production-example"
MODEL_PROVIDER = "meta"
MODEL_ID = "muse-spark-1.2"
MODEL_BASE_URL = "https://api.meta.ai/v1"

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "mergemate-db"
database_id = "local-only"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "TOKEN_REFRESHER"
class_name = "TokenRefresher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenRefresher"]

[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "mergemate_events"

# Deployed environments. D1 database ids are added when the databases are created (DEPLOY.md).
[env.dev]
name = "mergemate-api-dev"

[env.dev.vars]
APP_ENV = "development"
STRIPE_MODE = "test"
WEB_ORIGIN = "https://dev.mergemate.dev"
GITHUB_APP_CLIENT_ID = "Iv1.submission-dev-example"
GITHUB_APP_SLUG = "submission-production-example"
MODEL_PROVIDER = "meta"
MODEL_ID = "muse-spark-1.2"
MODEL_BASE_URL = "https://api.meta.ai/v1"

[[env.dev.ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.dev.ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[[env.dev.durable_objects.bindings]]
name = "TOKEN_REFRESHER"
class_name = "TokenRefresher"

[[env.dev.analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "mergemate_events_dev"

[env.production]
name = "mergemate-api"

# The production GitHub App's client id and slug are added when that app exists.
[env.production.vars]
APP_ENV = "production"
STRIPE_MODE = "disabled"
WEB_ORIGIN = "https://mergemate.dev"
MODEL_PROVIDER = "meta"
MODEL_ID = "muse-spark-1.2"
MODEL_BASE_URL = "https://api.meta.ai/v1"

[[env.production.ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 300, period = 60 }

[[env.production.durable_objects.bindings]]
name = "TOKEN_REFRESHER"
class_name = "TokenRefresher"

[[env.production.analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "mergemate_events"

[[queues.producers]]
binding = "STRIPE_EVENTS"
queue = "mergemate-stripe-events-local"
[[queues.consumers]]
queue = "mergemate-stripe-events-local"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "mergemate-stripe-events-local-dlq"

[[env.dev.queues.producers]]
binding = "STRIPE_EVENTS"
queue = "mergemate-stripe-events-dev"
[[env.dev.queues.consumers]]
queue = "mergemate-stripe-events-dev"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "mergemate-stripe-events-dev-dlq"

[[env.production.queues.producers]]
binding = "STRIPE_EVENTS"
queue = "mergemate-stripe-events"
[[env.production.queues.consumers]]
queue = "mergemate-stripe-events"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "mergemate-stripe-events-dlq"
