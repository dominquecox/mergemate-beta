# Non-secret config only. This Worker serves the Expo web export (apps/mobile/dist) with security headers.
# Build the export first: EXPO_PUBLIC_API_BASE_URL=<api origin> npm run export:web -w @mergemate/mobile
# Top level = local `wrangler dev`; API_ORIGIN feeds the CSP connect-src and must match the app's API base URL.
name = "mergemate-web"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "../mobile/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
API_ORIGIN = "http://localhost:8787"

# Deployed environments. Each serves only from its custom domain, which the deploy creates.
[env.dev]
name = "mergemate-web-dev"
workers_dev = false
preview_urls = false
routes = [{ pattern = "dev.mergemate.dev", custom_domain = true }]

[env.dev.assets]
directory = "../mobile/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[env.dev.vars]
API_ORIGIN = "https://api-dev.mergemate.dev"

# Production: app.mergemate.dev. API_ORIGIN feeds the CSP connect-src and must be the origin the export was built
# against (EXPO_PUBLIC_API_BASE_URL=https://api.mergemate.dev); the headers and CSP are the same code as dev. The
# Turnstile widget used by the build must list app.mergemate.dev (apps/api/DEPLOY.md, Production). A test pins this block.
[env.production]
name = "mergemate-web"
workers_dev = false
preview_urls = false
routes = [{ pattern = "app.mergemate.dev", custom_domain = true }]

[env.production.assets]
directory = "../mobile/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[env.production.vars]
API_ORIGIN = "https://api.mergemate.dev"
