<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0F17" />
    <title>Offline · MergeMate</title>
    <!-- Shown by the service worker only when a page can't load. Static and public: no account or PR data. -->
    <style>
      :root { color-scheme: dark light; --bg: #0B0F17; --surface: #131B2A; --text: #F8FAFC; --muted: #94A3B8; --brand: #4F46E5; --focus: #A5B4FC; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --muted: #475569; --focus: #4F46E5; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px 16px;
        background: var(--bg); color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main { width: 100%; max-width: 420px; padding: 32px 24px; border-radius: 16px; background: var(--surface); text-align: center; }
      h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; }
      p { margin: 0 0 24px; color: var(--muted); }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px;
        padding: 10px 24px; border-radius: 12px; background: var(--brand); color: #FFFFFF; font-weight: 600; text-decoration: none;
      }
      a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>MergeMate needs a connection to load your pull requests. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
