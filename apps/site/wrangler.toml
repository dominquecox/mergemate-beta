name = "mergemate-site"
main = "src/index.ts"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "mergemate.dev", custom_domain = true },
  { pattern = "www.mergemate.dev", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
EMAIL_FROM = "mergemate@ploonu.com"

[[d1_databases]]
binding = "DB"
database_name = "mergemate-waitlist-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "WAITLIST_RATE_LIMITER"
namespace_id = "1000"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = false
# Removal links carry bearer tokens in their query string. Do not trace request URLs.
[observability.traces]
enabled = false
